name: Deploy su GitHub Pages

# Pubblica la build compilata sul branch gh-pages ad ogni push su main.
# Nota: non usiamo il flusso "Pages tramite Actions" (configure-pages +
# deploy-pages) perche' la creazione del sito Pages via API viene rifiutata
# dal token automatico del workflow ("Resource not accessible by
# integration") finche' il sito non esiste gia'. Il metodo "Deploy from a
# branch" invece funziona subito: basta selezionare una volta, in Settings >
# Pages, Source = "Deploy from a branch", branch = gh-pages, cartella = /
# (root). Da quel momento in poi questo workflow aggiorna il sito ad ogni
# push, senza bisogno di altre chiamate API riservate.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
