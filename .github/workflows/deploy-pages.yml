name: Deploy su GitHub Pages

on:
  push:
    # "main" e' il trigger definitivo; il nome del branch di lavoro resta qui
    # solo per pubblicare subito durante lo sviluppo prima del merge della PR
    # e puo' essere rimosso una volta che main include questo workflow.
    branches:
      - main
      - claude/family-expense-dashboard-hq7u7d
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Necessario esplicitamente: dalla v5 l'azione non abilita piu'
          # Pages in automatico se non richiesto (default enablement: false).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
